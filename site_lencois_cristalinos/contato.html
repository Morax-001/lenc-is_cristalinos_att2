    <div class="contact-container">
        <h1>Contate-nos</h1>
        <p>Antes de começar a planejar sua viagem, se cadastre em nosso site logo abaixo.</p>
        
        <form id="form-contato" action="#" method="POST" novalidate>
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required placeholder="Seu nome completo">
            </div>
            
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="Seu melhor e-mail">
            </div>
            
            <div class="form-group">
                <label for="assunto">Assunto:</label>
                <input type="text" id="assunto" name="assunto" required placeholder="Sobre o que deseja falar?">
            </div>
            
            <div class="form-group">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" required maxlength="2000" placeholder="Como podemos ajudar?"></textarea>
                <small class="contador" id="contador">0 / 2000</small>
            </div>

            <!-- Campo isca anti-spam: pessoas não veem, robôs preenchem -->
            <div class="honeypot" aria-hidden="true">
                <label for="website">Não preencha este campo</label>
                <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
            </div>

            <div id="form-status" class="form-status" role="alert" aria-live="polite"></div>
            
            <button type="submit" class="btn-enviar">Enviar Mensagem</button>
        </form>
    </div>
